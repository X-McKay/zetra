name: Platform checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [contracts, controller, netpol-attestor, agent-runtime, egress-guard, runner]
    defaults:
      run:
        working-directory: platform/${{ matrix.project }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.13.1'
      - run: uv sync --frozen --python 3.12.14
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -m 'not cluster' -q
  runner-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: docker build -t session-runner:ci platform/runner
      - run: >-
          docker run --rm --read-only --network none --tmpfs /tmp
          --entrypoint /app/.venv/bin/python session-runner:ci
          -c "import runner.worker, runner.core, agent_runtime.core_protocol; import shutil; assert shutil.which('git') is None"
  aps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/aps
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: platform/aps/go.mod
      - run: go vet ./...
      - run: go test ./...
