name: SDK checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.13.1'
      - run: uv sync --frozen --python 3.12.14
      - run: uv run ruff check src tests scripts benchmarks examples
      - run: uv run ruff format --check src tests scripts benchmarks examples
      - run: uv run pytest -m 'not cluster' -q
      - run: uv run zetra quality examples/workspace_reporter
      - run: uv run python scripts/check_docs.py
  local-temporal:
    runs-on: ubuntu-latest
    env:
      ZETRA_TEMPORAL_TEST_BINARY: /tmp/zetra-temporal-cli/temporal
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.13.1'
      - run: uv sync --frozen --python 3.12.14
      - name: Install checksum-pinned local Temporal CLI
        run: |
          mkdir -p /tmp/zetra-temporal-cli
          curl --fail --location --retry 3 https://github.com/temporalio/cli/releases/download/v1.9.1/temporal_cli_1.9.1_linux_amd64.tar.gz -o /tmp/zetra-temporal-cli/cli.tar.gz
          cd /tmp/zetra-temporal-cli
          echo '09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5  cli.tar.gz' | sha256sum --check
          tar -xzf cli.tar.gz temporal
      - run: uv run pytest tests/sdk/test_local_host.py tests/sdk/test_local_temporal.py -q
