[project]
name = "agent-runtime"
version = "0.1.0"
description = "Sandbox runtime SDK: agent identity, gateway clients and the one-boundary step protocol"
requires-python = ">=3.12,<3.13"
# Match the shared SDK converter's OpenAI/httpx versions. Existing immutable legacy
# images retain their old lock; legacy API behavior is regression-tested here too.
dependencies = [
    "zetra",
    "PyYAML==6.0.3",
    "httpx==0.28.1",
    "mcp==1.30.0",
    "openai==2.54.0",
]

[tool.uv.sources]
zetra = { git = "https://github.com/X-McKay/zetra.git", rev = "750180967185181181c2ebc95e19e2c913756e67" }

[project.optional-dependencies]
landlock = ["landlock==1.0.0.dev5"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["cluster: requires a real cluster, identity provider and gateway"]

[tool.ruff]
target-version = "py312"
line-length = 100
