[project]
name = "agent-platform-session-api"
version = "0.1.0"
description = "Session interface: starts, reads, cancels and lists agent sessions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-platform-runner",
    "fastapi==0.163.2",
    "httpx==0.28.1",
    "kubernetes==34.1.0",
    "pyjwt[crypto]==2.15.1",
    "uvicorn==0.54.0",
]

[project.scripts]
session-api = "session_api.cli:main"

[tool.uv.sources]
agent-platform-runner = { path = "../runner", editable = true }

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["session_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
