[project]
name = "agent-platform-provisioner"
version = "0.1.0"
description = "Agent Registry provisioner: applies the registry's desired Agents and AgentReleases to a cluster"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "kubernetes==34.1.0",
]

[project.scripts]
registry-provisioner = "registry_provisioner.main:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["registry_provisioner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
