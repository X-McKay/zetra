[project]
name = "egress-guard"
version = "0.1.0"
description = "Sandbox init container: exit 0 only after host-side attestation and a reachable gateway"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["egress_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cluster: requires a real cluster"]

[tool.ruff]
target-version = "py312"
line-length = 100
