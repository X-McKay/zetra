# Valid: an agent that acts with the identity of the person who started the session. Without a person the session is refused (required: true, fallback: deny); the tool backend is asked to see the same person (delegation).
apiVersion: agentplatform.io/v1alpha1
kind: Agent
metadata:
  name: acts-on-behalf-of-a-person
  namespace: tenant-example
spec:
  owner: dev@example.com
  identity:
    mode: on-behalf-of
    onBehalfOf: {required: true, fallback: deny}
  capabilities:
    models:
      - backend: llm-main
        models: [example-model]
        budget: {tokensPerDay: 1000000, tokensPerSession: 200000}
    mcp:
      - backend: example-tickets
        effect: remote_read
        tools: [tickets_search]
        delegation: on-behalf-of
  runtime: {cpu: "1", memory: 1Gi, ttlSeconds: 1800}
