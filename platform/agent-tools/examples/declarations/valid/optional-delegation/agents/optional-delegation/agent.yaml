# Valid: an agent that acts for the person who started the session when there is one, and as itself when there is not. The identity mode is agent, so a session is never required to carry a person's grant; the tool grant's delegation on-behalf-of is then used when a person's grant is present, and onBehalfOf.fallback: agent lets the call go ahead as the agent when it is not. Without that fallback the declaration is refused (see invalid/grant-delegation-without-a-person).
schema_version: 1
name: optional-delegation
entrypoint: optional_delegation.agent:create_agent
instructions: optional_delegation/instructions/base.md
model:
  backend: llm-main
  name: example-model
  max_tokens: 1024
  temperature: 0
tools:
  - name: write_report
    effect: workspace_write
