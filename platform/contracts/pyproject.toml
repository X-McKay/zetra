[project]
name = "agent-platform-contracts"
version = "0.1.0"
description = "Agent Runtime Platform shared contracts: constants, naming, policy bundle, pod template, NetworkPolicies"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyYAML==6.0.3",
]

[project.scripts]
agentctl = "agent_platform.cli:main"

[dependency-groups]
dev = [
    "kubernetes==34.1.0",
    "pytest==8.4.2",
    "ruff==0.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["cluster: requires a real cluster"]
addopts = "-m 'not cluster'"

[tool.ruff]
target-version = "py312"
line-length = 100
