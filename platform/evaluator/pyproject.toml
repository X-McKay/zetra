[project]
name = "agent-platform-evaluator"
version = "0.1.0"
description = "Agent Registry evaluator: runs a release's evaluation suite and reports the verdict"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
]

[project.scripts]
registry-evaluator = "registry_evaluator.main:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["registry_evaluator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
