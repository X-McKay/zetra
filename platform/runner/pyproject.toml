[project]
name = "agent-platform-runner"
version = "0.1.0"
description = "Agent Runtime Platform Session Runner: Temporal sessions over Kata sandboxes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyYAML==6.0.3",
    "cryptography==50.0.0",
    "kubernetes==34.1.0",
    "temporalio==1.34.0",
]

[project.scripts]
agent-session-runner = "runner.worker:main"
agent-session-submit = "runner.submit:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "ruff==0.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["cluster: requires a real cluster, APS and Temporal"]
addopts = "-m 'not cluster'"

[tool.ruff]
target-version = "py312"
line-length = 100
