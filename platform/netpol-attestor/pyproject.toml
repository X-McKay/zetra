[project]
name = "agent-platform-netpol-attestor"
version = "0.1.0"
description = "Agent Runtime Platform node attestor of kube-router per-pod firewall chains"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kubernetes==34.1.0",
]

[project.scripts]
netpol-attestor = "netpol_attestor.main:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["netpol_attestor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["cluster: requires a real node running kube-router"]
addopts = "-m 'not cluster'"

[tool.ruff]
target-version = "py312"
line-length = 100
