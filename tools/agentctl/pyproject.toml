[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentctl-playbook"
version = "0.4.0"
description = "Golden-path development and conformance tooling for the Agent Playbook"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "jsonschema>=4.25,<5",
  "PyYAML>=6.0,<7",
  "rich>=14.2,<15",
  "rich-argparse>=1.7,<2",
]

[project.scripts]
agentctl = "agentctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentctl"]

[dependency-groups]
dev = ["ruff==0.16.9"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TRY"]
ignore = ["E501", "TRY003"]

[tool.ruff.lint.isort]
known-first-party = ["agentctl"]
