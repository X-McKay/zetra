name: Build wheel artifact
on: workflow_dispatch
jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --locked pytest
      - run: uv build --wheel
      - run: uv run --locked python tests/packaging/check_wheel.py dist/*.whl
      - run: sha256sum dist/*.whl > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/
