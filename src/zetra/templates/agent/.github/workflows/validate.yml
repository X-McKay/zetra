name: Validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest
      - run: uv run --locked zetra check .
      - run: uv run --locked zetra eval . --mode fixture
      - run: uv build --wheel
      - run: uv run --locked python tests/packaging/check_wheel.py dist/*.whl
