[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-package"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["zetra @ git+https://github.com/X-McKay/zetra.git@a74b3f6e042353fb9d6d5c36942af4d988c7cd47"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.zetra.agents]
document_reader = "src/agent_package/agents/document_reader/agent.yaml"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_package"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.hatch.metadata]
allow-direct-references = true
