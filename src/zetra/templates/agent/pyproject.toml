[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-package"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["zetra @ git+https://github.com/X-McKay/zetra.git@ee8870bea7a6a7445faa75e923129e8e3b3e975d"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.zetra.agents]
document_reader = "src/agent_package/agents/document_reader/agent.yaml"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_package"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.hatch.metadata]
allow-direct-references = true
