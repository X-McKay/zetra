apiVersion: v1
kind: Namespace
metadata:
  name: zetra-gateway-test
  labels:
    zetra.dev/purpose: disposable-live-qualification
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: zetra-gateway-test
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      batch:
        timeout: 1s
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: zetra-gateway-test
spec:
  replicas: 1
  selector:
    matchLabels: {app: zetra-test-otel}
  template:
    metadata:
      labels: {app: zetra-test-otel}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: collector
          # Verified ARM64 image resolved from official 0.162.0 in this fixture.
          image: docker.io/otel/opentelemetry-collector@sha256:310a800ad69ee430e7c541796852a242c9c7db97aaad4daa5ccf843c525fbdb2
          args: ["--config=/etc/otel/config.yaml"]
          ports: [{name: otlp, containerPort: 4317}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 192Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/otel, readOnly: true}
      volumes:
        - name: config
          configMap: {name: otel-collector-config}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: zetra-gateway-test
spec:
  selector: {app: zetra-test-otel}
  ports: [{name: otlp, port: 4317, targetPort: 4317}]
