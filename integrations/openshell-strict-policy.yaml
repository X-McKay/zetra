# Zetra disposable fixture; pinned OpenShell0.1.2 supported policy schema.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: hard_requirement
# No network rules or providers. Unapproved traffic must remain denied.
