[project]
name = "zetra"
version = "0.1.0"
description = "Durable sandboxed Google ADK agents with Temporal"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyYAML==6.0.3",
    "google-adk==2.12.0",
    "google-genai==2.31.0",
    "httpx==0.28.1",
    "litellm==1.95.0",
    "openshell==0.1.4",
    "temporalio==1.34.0",
    "zetra-agents",
]

[project.scripts]
zetra = "zetra.cli:main"

[dependency-groups]
dev = [
    "aiohttp==3.14.4",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zetra"]

# `zetra init` renders agent repositories with the tooling every such repository pins;
# both live in this repository, so the CLI and the layout it emits are one commit.
[tool.uv.sources]
zetra-agents = { path = "platform/agent-tools" }
agent-platform-contracts = { path = "platform/contracts" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["cluster: requires a real Temporal service via TEMPORAL_ADDRESS", "live: opt-in inference against the pinned local vLLM endpoint"]

[tool.ruff]
target-version = "py312"
line-length = 100
