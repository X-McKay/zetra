server:
  replicaCount: 1
  config:
    persistence:
      numHistoryShards: 16
      datastores:
        default:
          sql:
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: postgres:5432
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-db
            secretKey: password
            maxConns: 5
            maxIdleConns: 2
            createDatabase: true
            manageSchema: true
        visibility:
          sql:
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: postgres:5432
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-db
            secretKey: password
            maxConns: 5
            maxIdleConns: 2
            createDatabase: true
            manageSchema: true
  frontend:
    replicaCount: 1
  history:
    replicaCount: 1
  matching:
    replicaCount: 1
  worker:
    replicaCount: 1
web:
  enabled: false
schema:
  backoffLimit: 3
