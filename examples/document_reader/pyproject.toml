[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "document_reader"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["zetra @ git+https://github.com/X-McKay/zetra.git@af2e7542b89265eaa4572a586719a67e58238e74"]
[tool.hatch.build.targets.wheel]
packages = ["src/document_reader"]

[tool.zetra.agents]
document_reader = "src/document_reader/agents/document_reader/agent.yaml"


[tool.hatch.metadata]
allow-direct-references = true
