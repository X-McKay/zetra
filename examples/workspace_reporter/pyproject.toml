[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "workspace_reporter"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["zetra @ git+https://github.com/X-McKay/zetra.git@af2e7542b89265eaa4572a586719a67e58238e74"]
[tool.hatch.build.targets.wheel]
packages = ["src/workspace_reporter"]

[tool.zetra.agents]
workspace_reporter = "src/workspace_reporter/agents/workspace_reporter/agent.yaml"


[tool.hatch.metadata]
allow-direct-references = true
