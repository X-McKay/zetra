[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "workspace_reporter"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["zetra @ git+https://github.com/X-McKay/zetra.git@61a579c3de43844c7bb0ef13fe32fab000316c07"]
[tool.hatch.build.targets.wheel]
packages = ["src/workspace_reporter"]

[tool.zetra.agents]
workspace_reporter = "src/workspace_reporter/agents/workspace_reporter/agent.yaml"


[tool.hatch.metadata]
allow-direct-references = true
